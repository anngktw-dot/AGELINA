<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FamilyGuard — Child Check-In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="child">
  <main class="container narrow">
    <div class="eyebrow">FamilyGuard</div>
    <h1>Child check-in</h1>
    <p class="muted">Share only the information you want to send to the parent dashboard.</p>

    <section class="card wide form-card">
      <label>Status
        <input id="statusInput" value="All good" maxlength="80" />
      </label>

      <label>Location label
        <input id="locationInput" value="Home" maxlength="120" />
      </label>

      <label>Battery: <strong id="batteryValue">86%</strong>
        <input id="batteryInput" type="range" min="0" max="100" value="86" />
      </label>

      <button id="sendCheckIn">Send check-in</button>
      <p id="result" class="muted"></p>
    </section>

    <a class="button secondary" href="index.html">Back to parent dashboard</a>
  </main>

  <script src="app.js"></script>
</body>
</html>
